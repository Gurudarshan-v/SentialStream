<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisX Sentinel — Operations Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .leaflet-container { background: #020617 !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col m-0 overflow-hidden font-sans">
    
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 bg-sky-500 rounded-full animate-ping"></div>
            <h1 class="font-bold tracking-wider text-sky-400 text-lg">AEGISX SENTINEL // COMMAND CENTER</h1>
        </div>
        <div id="activeCount" class="text-xs font-mono bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 text-slate-300">
            Active Feeds: 0
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <div id="map" class="flex-2 h-full"></div>
        
        <div class="w-96 bg-slate-900 border-l border-slate-800 flex flex-col p-4 overflow-y-auto space-y-4">
            <div>
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Active Unit Telemetry</h2>
                <div id="deviceList" class="space-y-3">
                    <div class="text-slate-500 text-xs italic">Awaiting telemetry streams...</div>
                </div>
            </div>

            <div class="flex-1 flex flex-col">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Encrypted Audit Logs</h2>
                <div id="logBox" class="bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-[11px] text-emerald-400 h-48 overflow-y-auto leading-relaxed">
                    [System] Initializing secure telemetry grid...
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map("map", { zoomControl: false }).setView([20.5937, 78.9629], 5);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const markers = {};
        const polylines = {};

        async function pollTelemetry() {
            try {
                const response = await fetch("/api/locations");
                const data = await response.json();
                const devices = data.devices;
                const logs = data.logs;

                const deviceIds = Object.keys(devices);
                document.getElementById("activeCount").innerText = `Active Feeds: ${deviceIds.length}`;

                // Render Logs
                document.getElementById("logBox").innerText = logs.join("\n");

                // Render Sidebar Cards
                const listContainer = document.getElementById("deviceList");
                if (deviceIds.length === 0) {
                    listContainer.innerHTML = '<div class="text-slate-500 text-xs italic">Awaiting telemetry streams...</div>';
                } else {
                    listContainer.innerHTML = "";
                    deviceIds.forEach(id => {
                        const d = devices[id];
                        listContainer.innerHTML += `
                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-lg border-l-4 border-emerald-500 text-xs space-y-1">
                                <div class="font-bold text-sky-300">${id}</div>
                                <div>Lat/Lon: ${d.latitude.toFixed(4)}, ${d.longitude.toFixed(4)}</div>
                                <div class="text-slate-400">Precision: ±${d.accuracy}m | Speed: ${d.speed} km/h</div>
                                <div class="text-[10px] text-slate-500">Last Seen: ${d.last_seen} | IP: ${d.ip_address}</div>
                            </div>
                        `;
                    });
                }

                // Cleanup removed devices
                for (const id in markers) {
                    if (!devices[id]) {
                        map.removeLayer(markers[id]);
                        map.removeLayer(polylines[id]);
                        delete markers[id];
                        delete polylines[id];
                    }
                }

                // Update Map Markers & Breadcrumb Trails
                deviceIds.forEach(id => {
                    const d = devices[id];
                    const popupContent = `<strong>${id}</strong><br>Lat: ${d.latitude}, Lon: ${d.longitude}<br>Speed: ${d.speed} km/h`;

                    if (markers[id]) {
                        markers[id].setLatLng([d.latitude, d.longitude]).setPopupContent(popupContent);
                        polylines[id].setLatLngs(d.path);
                    } else {
                        markers[id] = L.marker([d.latitude, d.longitude]).addTo(map).bindPopup(popupContent);
                        polylines[id] = L.polyline(d.path, { color: '#38bdf8', weight: 3, opacity: 0.7 }).addTo(map);
                        map.setView([d.latitude, d.longitude], 15);
                    }
                });

            } catch (err) {
                console.error("Telemetry sync error:", err);
            }
        }

        setInterval(pollTelemetry, 3000);
        pollTelemetry();
    </script>
</body>
</html>
